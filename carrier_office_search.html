<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>営業所を探す</title>
  <style>
    :root {
      --accent: #1565C0;
      --accent-soft: rgba(21, 101, 192, 0.1);
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #1a202c;
      --muted: #64748b;
      --border: #e2e8f0;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%);
      color: var(--text);
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem;
    }

    .card {
      width: 100%;
      max-width: 500px;
      background: var(--card);
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08), 0 2px 6px rgba(15, 23, 42, 0.04);
      border-top: 5px solid var(--accent);
      transition: border-color 0.3s ease;
      animation: fadeUp 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .shake {
      animation: shake 0.35s ease;
      border-color: #e53e3e !important;
      box-shadow: 0 0 0 3px rgba(229, 62, 62, 0.15) !important;
    }

    h2 {
      font-size: 22px;
      font-weight: 700;
      margin: 0 0 0.35rem;
      letter-spacing: -0.02em;
    }

    .sub {
      font-size: 13.5px;
      color: var(--muted);
      margin: 0 0 1.5rem;
      line-height: 1.5;
    }

    .field {
      margin-bottom: 1.15rem;
    }

    label {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--muted);
      display: block;
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      font-family: inherit;
      font-size: 15px;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: #f8fafc;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    input:focus, select:focus {
      background: #fff;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .err-msg {
      font-size: 12px;
      color: #e53e3e;
      margin-top: 5px;
      min-height: 16px;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .err-msg.show { opacity: 1; }

    .badge {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--accent-soft);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 1.25rem;
      transition: background 0.3s ease;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
      box-shadow: 0 0 0 3px rgba(255,255,255,0.7);
      transition: background 0.3s ease, transform 0.25s ease;
    }

    .badge-info {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .badge-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
    }

    .badge-keyword {
      font-size: 11.5px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 13px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 12px var(--accent-soft);
      transition: background 0.3s ease, transform 0.15s ease, box-shadow 0.2s ease, opacity 0.2s ease;
      margin-bottom: 0.75rem;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.18);
      opacity: 0.94;
    }

    .btn:active {
      transform: translateY(0) scale(0.985);
    }

    .note {
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }

    hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 1.35rem 0;
    }

    .tip {
      background: #f8fafc;
      border-left: 3px solid var(--accent);
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 12.5px;
      color: var(--muted);
      line-height: 1.65;
      transition: border-color 0.3s ease;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>営業所を探す</h2>
  <div class="sub">住所と運送会社を選ぶと、Googleマップで最寄り拠点を検索します</div>

  <div class="field">
    <label for="address">お客様の住所</label>
    <input type="text" id="address" placeholder="例：大阪市北区梅田1丁目" autocomplete="street-address" />
    <div class="err-msg" id="errMsg">住所を入力してください</div>
  </div>

  <div class="field">
    <label for="carrier">運送会社</label>
    <select id="carrier" onchange="onChange()">
      <option value="sagawa">佐川急便</option>
      <option value="yamato">ヤマト運輸</option>
      <option value="yupack">日本郵便</option>
      <option value="seino">西濃運輸</option>
      <option value="fukutsu">福山通運</option>
      <option value="jplogistics">JPロジスティクス</option>
      <option value="kinbutsurex">近物レックス</option>
      <option value="tonami">トナミ運輸</option>
      <option value="daiichi">第一貨物</option>
      <option value="meitetsuunyu">名鉄運輸</option>
      <option value="sline">エスライン</option>
      <option value="seino_sx">セイノースーパーエクスプレス</option>
      <option value="okaken">岡山県貨物運送</option>
      <option value="kurumeunsou">久留米運送</option>
    </select>
  </div>

  <div class="badge">
    <div class="dot" id="dot"></div>
    <div class="badge-info">
      <div class="badge-name" id="bname"></div>
      <div class="badge-keyword" id="bkw"></div>
    </div>
  </div>

  <button class="btn" id="btn" onclick="doSearch()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
      <circle cx="12" cy="10" r="3"></circle>
    </svg>
    Googleマップで営業所を探す
  </button>
  <div class="note">※ Googleマップが新しいタブで開きます</div>

  <hr />

  <div class="tip">
    他社の類似名称が混ざりにくいよう、会社名ごとの検索ワードと除外ワードを調整しています。周辺に複数候補が表示された場合は、最寄りの拠点を選んでください。
  </div>
</div>

<script>
const C = {
  sagawa:       { name:'佐川急便',                     color:'#1565C0', kw:'"佐川急便" 営業所' },
  yamato:       { name:'ヤマト運輸',                   color:'#212121', kw:'"ヤマト運輸" 営業所' },
  yupack:       { name:'日本郵便',                     color:'#C62828', kw:'"郵便局" -ヤマト -佐川' },
  seino:        { name:'西濃運輸',                     color:'#B71C1C', kw:'"西濃運輸" 支店 OR 営業所 -スーパーエクスプレス' },
  fukutsu:      { name:'福山通運',                     color:'#1B5E20', kw:'"福山通運" 支店 OR 営業所' },
  jplogistics:  { name:'JPロジスティクス',             color:'#4A148C', kw:'"JPロジスティクス" -JPエクスプレス -郵便局' },
  kinbutsurex:  { name:'近物レックス',                 color:'#E65100', kw:'"近物レックス"' },
  tonami:       { name:'トナミ運輸',                   color:'#006064', kw:'"トナミ運輸"' },
  daiichi:      { name:'第一貨物',                     color:'#37474F', kw:'"第一貨物"' },
  meitetsuunyu: { name:'名鉄運輸',                     color:'#880E4F', kw:'"名鉄運輸"' },
  sline:        { name:'エスライン',                   color:'#558B2F', kw:'"エスラインギフ" OR "エスライン"' },
  seino_sx:     { name:'セイノースーパーエクスプレス', color:'#BF360C', kw:'"セイノースーパーエクスプレス"' },
  okaken:       { name:'岡山県貨物運送',               color:'#4527A0', kw:'"岡山県貨物運送"' },
  kurumeunsou:  { name:'久留米運送',                   color:'#00695C', kw:'"久留米運送"' },
};

function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

function onChange() {
  const key = document.getElementById('carrier').value;
  const c = C[key];
  const root = document.documentElement;
  root.style.setProperty('--accent', c.color);
  root.style.setProperty('--accent-soft', hexToRgba(c.color, 0.1));

  document.getElementById('bname').textContent = c.name;
  document.getElementById('bkw').textContent = '検索条件：' + c.kw;

  // ドットの軽いポップアニメーション
  const dot = document.getElementById('dot');
  dot.style.transform = 'scale(1.35)';
  setTimeout(() => { dot.style.transform = 'scale(1)'; }, 180);
}

function doSearch() {
  const input = document.getElementById('address');
  const errMsg = document.getElementById('errMsg');
  const addr = input.value.trim();

  if (!addr) {
    input.classList.remove('shake');
    void input.offsetWidth; // アニメーション再発火用
    input.classList.add('shake');
    errMsg.classList.add('show');
    input.focus();
    return;
  }

  errMsg.classList.remove('show');
  const key = document.getElementById('carrier').value;
  const c = C[key];
  const query = encodeURIComponent(addr + ' ' + c.kw);
  const url = `https://www.google.com/maps/search/?api=1&query=${query}`;
  window.open(url, '_blank', 'noopener,noreferrer');
}

document.getElementById('address').addEventListener('input', () => {
  document.getElementById('address').classList.remove('shake');
  document.getElementById('errMsg').classList.remove('show');
});

document.getElementById('address').addEventListener('keydown', e => {
  if (e.key === 'Enter') doSearch();
});

onChange();
</script>
</body>
</html>
